name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Validate HTML
        run: npx html-validate "index.html" "calculator.html" "blog/*.html" "papers/*.html"

      - name: Link check (internal links)
        run: npx linkinator --file index.html --recursive --skip "^https?://"
